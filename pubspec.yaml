name: ai_explorer
description: AI literacy app for children ages 5–7
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Navigation
  go_router: ^18.0.2

  # Local storage
  hive_flutter: ^1.1.0

  # Audio
  just_audio: ^0.10.6
  audio_session: ^0.2.4

  # Speech recognition (on-device)
  speech_to_text: ^7.5.0

  # Rive animation
  rive: 0.13.20  # pinned: 0.14 replaces the Dart runtime with rive_native (separate migration)

  # Widget animation
  flutter_animate: ^4.5.0

  # RevenueCat
  purchases_flutter: ^10.14.0

  # Utilities
  path_provider: ^2.1.4
  uuid: ^4.4.2
  intl: ^0.20.3
  crypto: ^3.0.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.12
  riverpod_generator: ^4.0.9
  freezed: ^4.0.2
  json_serializable: ^6.8.0
  # test/support/rive_inspect.dart reads .riv files with the runtime's decoders
  rive_common: 0.4.15  # same version rive 0.13.20 resolves
  # test/ci_workflow_test.dart parses the CI workflow
  yaml: ^3.1.4

flutter:
  uses-material-design: true

  assets:
    - assets/episodes/pattern_forest/
    - assets/episodes/music_lab/
    - assets/audio/en/
    - assets/audio/hi/
    - assets/audio/te/
    - assets/rive/
    - assets/legal/
